<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Giro Livre">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Giro Livre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: painel de ciclocomputador. Perfil de zonas como assinatura visual, abas fixas embaixo, folhas deslizantes para detalhe. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface2:#e3e7ec; --ink:#141920; --muted:#5a6572; --line:#d2d8df;
  --accent:#1d5bd0; --accent-ink:#ffffff;
  --z1:#7a91ab; --z2:#2a9a66; --z3:#d39f0f; --z4:#e36a1c; --z5:#d23838;
  --shadow:0 1px 2px rgba(20,25,32,.06),0 6px 18px rgba(20,25,32,.06);
  --f-disp:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1014; --surface:#161a20; --surface2:#1f252d; --ink:#e8ecf1; --muted:#93a0ad; --line:#29303a;
  --accent:#6e9bff; --accent-ink:#0a1020;
  --z1:#8ea5c1; --z2:#41c488; --z3:#efc23a; --z4:#ff8a3d; --z5:#ff5c5c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1014; --surface:#161a20; --surface2:#1f252d; --ink:#e8ecf1; --muted:#93a0ad; --line:#29303a;
  --accent:#6e9bff; --accent-ink:#0a1020;
  --z1:#8ea5c1; --z2:#41c488; --z3:#efc23a; --z4:#ff8a3d; --z5:#ff5c5c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
h1,h2,h3{font-family:var(--f-disp);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:19px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-block:4px 16px}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--z1);display:inline-block}
.sync.on i{background:var(--z2)}
section{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tap{cursor:pointer;transition:border-color .15s}
.card.tap:hover{border-color:var(--muted)}
.hero{box-shadow:var(--shadow);border-color:transparent;padding:16px}
.prof{display:block;width:100%;height:44px;border-radius:6px;background:var(--surface2)}
.prof.lg{height:64px}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%}
.zp{display:inline-block;min-width:28px;text-align:center;font-weight:700;font-size:12px;padding:2px 6px;border-radius:6px;color:#fff}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:10px 14px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:15px}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--z5)}
.btn.wide{flex:1}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--f-body);padding:7px 12px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{font:500 15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.slider{display:flex;align-items:center;gap:12px}
.slider output{font-family:var(--f-disp);font-weight:800;font-size:26px;min-width:84px;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.tile b{display:block;font-family:var(--f-disp);font-size:28px;font-weight:800;line-height:1}
.tile span{font-size:11.5px;color:var(--muted)}
@media (max-width:460px){.tiles{grid-template-columns:repeat(2,1fr)}}
/* semana */
.week{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day .dn{font-family:var(--f-disp);font-weight:800;font-size:20px;line-height:1;text-transform:uppercase}
.day .dd{font-size:11.5px;color:var(--muted)}
.day .body{min-width:0;display:flex;flex-direction:column;gap:5px}
.day .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .prof{height:22px}
.state{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.state.ok{background:color-mix(in srgb,var(--z2) 18%,transparent);color:var(--z2)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--z4)}
/* biblioteca */
.list{display:flex;flex-direction:column;gap:10px}
.lc-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lc-head > div{min-width:0}
.foco{font-size:13px;color:var(--muted)}
details.ref{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.ref summary{cursor:pointer;font-weight:600}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:11px;color:var(--muted);text-align:center;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding-bottom:2px}
.cal-d{appearance:none;aspect-ratio:1/1.1;border:1px solid var(--line);border-radius:9px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:700 14px var(--f-body);color:var(--ink);cursor:pointer;padding:2px;min-width:0;font-variant-numeric:tabular-nums}
.cal-d.out{visibility:hidden}
.cal-d.fut{color:var(--muted);background:transparent}
.cal-d.done{background:color-mix(in srgb,var(--zc) 24%,var(--surface));border-color:var(--zc)}
.cal-d.today{box-shadow:0 0 0 2px var(--accent)}
.cal-d.sel{outline:2px solid var(--ink);outline-offset:1px}
.cal-d small{font-size:10px;font-weight:600;color:var(--muted);line-height:1}
.cal-d.done small{color:var(--ink)}
.cal-leg{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.cal-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.35}
.tip b{font-weight:700}
.rpe-tip{font-size:14px;color:var(--ink);min-height:1.4em}
.player>*{flex-shrink:0}
.player .ctrl{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-16px - env(safe-area-inset-bottom,0px));z-index:2}
.qa{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 2px}
.qa::-webkit-scrollbar{display:none}
.qa .btn{flex:none;min-height:42px;padding:8px 13px;font-size:14px;white-space:nowrap}
.ask{display:flex;gap:6px}
.ask input{flex:1;min-width:0}
.toast{position:fixed;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:80;max-width:656px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.3}
.toast .tt b{font-size:15px}
.toast .btn{background:transparent;color:inherit;border-color:currentColor;min-height:36px;padding:6px 12px;font-size:13px}
.toast.err{background:var(--z5);color:#fff}
.queue.chg .qi{animation:qflash 1.6s ease-out}
@keyframes qflash{0%{background:color-mix(in srgb,var(--accent) 35%,var(--surface))}100%{background:var(--surface)}}
.sync.err i{background:var(--z5)}
/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:600 12px var(--f-body);padding:8px 2px 6px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{stroke:var(--accent)}
/* folha */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet.full{height:92%}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{appearance:none;border:0;background:var(--surface2);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper output{font-family:var(--f-disp);font-weight:800;font-size:24px;min-width:70px;text-align:center}
.opt{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:11px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.opt .prof{height:22px}
.opt div{min-width:0}
.opt .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* editor */
.blk{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--z2);border-radius:11px;padding:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.blk .full{grid-column:1/-1}
.blk .two{grid-column:span 2}
.blk .acts{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
@media (max-width:460px){.blk{grid-template-columns:repeat(2,minmax(0,1fr))}.blk .two{grid-column:1/-1}}
/* player */
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));gap:12px;overflow:auto}
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pl-top .nm{font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band{border-radius:18px;padding:16px;background:color-mix(in srgb,var(--cur) 20%,var(--surface));border:2px solid var(--cur);display:flex;flex-direction:column;gap:6px;transition:background .4s,border-color .4s}
.zname{font-family:var(--f-disp);font-weight:800;font-size:22px;text-transform:uppercase;color:var(--cur);letter-spacing:.02em}
.clock{font-family:var(--f-disp);font-weight:800;font-size:clamp(84px,26vw,140px);line-height:.9;font-variant-numeric:tabular-nums}
.cmd{font-size:19px;font-weight:600;line-height:1.3}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{display:block;font-family:var(--f-disp);font-size:26px;font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.stat b.sm{font-size:17px;font-family:var(--f-body);font-weight:700;line-height:1.25}
.next{font-size:14px;color:var(--muted)}
.band{position:relative;overflow:hidden}
.queue{display:flex;flex-direction:column;gap:6px}
.qi{display:grid;grid-template-columns:58px 34px minmax(0,1fr);gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--z1);border-radius:10px;padding:8px 10px;font-size:14px}
.qi:first-of-type{border-width:2px 2px 2px 6px}
.qi .t{font-weight:700;font-size:13px;color:var(--muted)}
.pl-top .btn{white-space:nowrap}
.qi b{font-weight:700}
.cd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:color-mix(in srgb,var(--nx) 92%,#000);color:#fff;text-align:center;padding:12px}
.cd-l{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.cd-n{font-family:var(--f-disp);font-weight:800;font-size:clamp(110px,34vw,180px);line-height:.85;font-variant-numeric:tabular-nums}
.cd-t{font-size:17px;font-weight:700;line-height:1.3}
@media (prefers-reduced-motion:no-preference){.cd-n{animation:cdp 1s ease-out infinite}@keyframes cdp{0%{transform:scale(1.12)}40%{transform:scale(1)}}}
.next b{color:var(--ink)}
.tl{position:relative}
.tl .mark{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:auto}
.ctrl .btn{min-height:58px;font-size:16px}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe .chip{padding:9px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
kbd,.kbd-hint{display:none}
@media (min-width:1000px) and (hover:hover){
  .wrap{max-width:1180px;padding-inline:32px;padding-block:88px 48px}
  nav.tabs{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:8px 32px}
  nav.tabs .in{max-width:1180px;display:flex;align-items:center;gap:4px}
  nav.tabs .in::before{content:'GIRO LIVRE';font-family:var(--f-disp);font-weight:800;font-size:24px;letter-spacing:.02em;color:var(--ink);margin-right:auto}
  .tab{flex-direction:row;gap:8px;font-size:14px;padding:10px 16px}
  .tab[aria-selected="true"]{background:var(--surface2)}
  h1{font-size:44px}
  .wrap .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .wrap .list>.btn,.wrap .list>.empty{grid-column:1/-1}
  .card:has(.cal){max-width:760px}
  .scrim{align-items:center}
  .sheet{border-radius:18px;max-height:86%}
  .player:has(.band){display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"top top" "ask ask" "band qa" "band queue" "stats queue" "tip queue" "tl tl" "time time" "kbd kbd" "ctrl ctrl";grid-template-rows:auto auto auto auto auto 1fr auto auto auto auto;column-gap:28px;row-gap:14px;padding:24px max(40px,calc((100vw - 1280px)/2)) 24px;align-content:start}
  .player:has(.band)>.pl-top{grid-area:top}
  .player:has(.band)>.band{grid-area:band;justify-content:center;padding:28px}
  .player:has(.band)>.stats{grid-area:stats}
  .player:has(.band)>.tip{grid-area:tip;align-self:start}
  .player:has(.band)>.qa{grid-area:qa;flex-wrap:wrap;overflow:visible;margin:0;padding:0}
  .player:has(.band)>.ask{grid-area:ask}
  .player:has(.band)>.queue{grid-area:queue;align-self:start}
  .player:has(.band)>.tl{grid-area:tl}
  .player:has(.band)>.row.between{grid-area:time}
  .player:has(.band)>.kbd-hint{grid-area:kbd;display:block;font-size:13px;color:var(--muted);text-align:center}
  .player:has(.band)>.ctrl{grid-area:ctrl;position:static;margin:0;padding:0;max-width:640px;justify-self:center;width:100%}
  .player .clock{font-size:clamp(120px,13vw,220px)}
  .player .cmd{font-size:24px}
  .qa .btn{gap:8px}
  kbd{display:inline-block;font:700 11px var(--f-body);padding:1px 6px;border-radius:5px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Seções"><div class="in" role="tablist" id="tabs"></div></nav>
<div id="layer"></div>

<script>
/* ===================== Base ===================== */
const POS={SP:'Sentado plano',SS:'Sentado subida',EP:'Em pé subida',FB:'Fora da bike',PA:'Parado na bike'};
const ZN={1:'Recuperação',2:'Base aeróbica',3:'Tempo',4:'Limiar',5:'VO₂máx'};
const MET={1:4.5,2:7,3:8.5,4:10.5,5:13};
const INT={1:'Leve',2:'Moderado',3:'Forte',4:'Máximo'};
const INTZ={1:1,2:2,3:4,4:5};
const M=60;
const b=(d,z,rpm,r,p,c)=>({d:Math.round(d),z,rpm,r,p:POS[p]||p,c});

/* rot: divide o tempo disponível em n trechos iguais (arredondados a 15 s), alternando o terreno */
function rot(avail,segs,seg){avail=Math.round(avail);if(avail<60)return[];const n=Math.max(1,Math.round(avail/seg));const d=q15(avail/n);const o=[];for(let i=0;i<n;i++)o.push(b(i<n-1?d:avail-d*(n-1),...segs[i%segs.length]));return o}
function reps(n,f){const o=[];for(let k=1;k<=n;k++)o.push(...f(k,n));return o}
/* sc: repete a unidade f quantas vezes couber no tempo e estica/encurta só os blocos flexíveis (os marcados com fx ficam fixos) */
function sc(avail,f,o={}){const mn=o.min||1,mx=o.max||99,smax=o.smax||1.6,smin=o.smin||.6;
  const u=f(1,1),U=sum(u),X=sum(u.filter(x=>x.fx)),F=U-X;let n=clamp(Math.round(avail/U),mn,mx);while(n>mn&&n*(X+F*smin)>avail)n--;
  const s=F?clamp((avail-n*X)/(n*F),smin,smax):1;
  const out=reps(n,(k,n)=>f(k,n).map(x=>{if(!x.fx)x.d=q15(x.d*s);return x}));
  const fl=out.filter(x=>!x.fx);let d=Math.round(avail-sum(out));
  if(fl.length&&s<smax&&s>smin){let i=0,g=0;while(Math.abs(d)>=15&&g<5000){const x=fl[i%fl.length],st=d>0?15:-15;if(x.d+st>=30){x.d+=st;d-=st}i++;g++}fl[fl.length-1].d+=d}
  return out}
const Z2PRE=[[2,'88–92','R4','SP','Base Z2 antes da parte principal, ritmo de estrada'],[2,'95–100','R3','SP','Base Z2, giro um pouco mais alto, mesmo esforço']];
const Z2POS=[[2,'88–92','R3','SP','Z2 de saída, giro constante antes de soltar'],[2,'92–96','R3','SP','Z2 de saída, mantém o giro redondo']];
function fit(bl,T){const diff=Math.round(T*60-sum(bl));bl.forEach(x=>delete x.fx);if(diff<=0)return bl;
  const li=bl.length-1,last=bl[li],isC=last&&/^Volta à calma/.test(last.c);
  if(!isC||diff<60){for(let i=li;i>=0;i--){if(bl[i].p!==POS.FB){bl[i].d+=diff;break}}return bl}
  if(diff<=180){last.d+=diff;return bl}
  let wi=-1;bl.forEach((x,i)=>{if(x.w)wi=i});
  let pre=wi>=0?q15(diff*.6):0,post=diff-pre;if(wi>=0&&post<120){pre=diff;post=0}
  if(post)bl.splice(li,0,...rot(post,Z2POS,6*M));
  if(pre)bl.splice(wi+1,0,...rot(pre,Z2PRE,6*M));
  return bl}

async function initDb(tries=0){
  if(!window.claude||!window.claude.use){if(tries<3)setTimeout(()=>initDb(tries+1),800);return}
  try{const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;
    const uid=await user.id();if(!uid)return;dbRef=db.doc('data/users/'+uid+'/giro');
    const snap=await dbRef.get();
    if(snap.exists){S=Object.assign(defState(),JSON.parse(JSON.stringify(snap.data())));if(ensureWeek())push();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}synced=true;render()}
    else{await dbRef.set(JSON.parse(JSON.stringify(S)));synced=true}
    setSync()}catch(e){}}
/* ---------- Sincronização (GitHub Gist) ---------- */
const GHK='giro_livre_sync';let GH=null,ghT=null,ghBusy=false,ghAt=0,ghErr='';
try{GH=JSON.parse(localStorage.getItem(GHK)||'null')}catch(e){}
const ghOK=()=>!/claude/.test(location.hostname)&&location.protocol==='https:';
async function ghApi(path,opt={}){const r=await fetch('https://api.github.com'+path,{...opt,cache:'no-store',headers:{'Authorization':'Bearer '+GH.tok,'Accept':'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function mergeS(a,b){const del=[...new Set([...(a.del||[]),...(b.del||[])])].slice(-800),dl=new Set(del);
  const hm=new Map();[...(a.hist||[]),...(b.hist||[])].forEach(x=>{if(!dl.has(x.id))hm.set(x.id,x)});
  const cm=new Map();[...(a.custom||[]),...(b.custom||[])].forEach(x=>{if(dl.has(x.id))return;const o=cm.get(x.id);if(!o||(x.u||0)>(o.u||0))cm.set(x.id,x)});
  const nw=(a.mod||0)>=(b.mod||0)?a:b,ol=nw===a?b:a;
  return Object.assign(defState(),nw,{hist:[...hm.values()].sort((x,y)=>x.ts-y.ts).slice(-500),custom:[...cm.values()].sort((x,y)=>(y.u||0)-(x.u||0)),del,prog:Object.assign({},ol.prog,nw.prog),mod:Math.max(a.mod||0,b.mod||0)})}
async function ghPull(){if(!GH||!GH.id||!ghOK())return;try{const g=await ghApi('/gists/'+GH.id);const f=g.files&&g.files['giro-livre.json'];
    if(f&&f.content){const r=JSON.parse(f.content),m=mergeS(S,r),ch=JSON.stringify(m)!==JSON.stringify(S);S=m;ensureWeek();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(ch&&!P)render();if(JSON.stringify(r)!==JSON.stringify(S))ghQueue(1)}
    ghAt=Date.now();ghErr=''}catch(e){ghErr=String(e.message)}setSync()}
function ghQueue(now){if(!GH||!GH.id||!ghOK())return;clearTimeout(ghT);ghT=setTimeout(ghPush,now?100:2500)}
async function ghPush(){if(!GH||!GH.id||ghBusy)return;ghBusy=true;try{await ghApi('/gists/'+GH.id,{method:'PATCH',body:JSON.stringify({files:{'giro-livre.json':{content:JSON.stringify(S)}}})});ghAt=Date.now();ghErr=''}catch(e){ghErr=String(e.message)}ghBusy=false;setSync()}
async function ghConnect(code){code=code.trim();let tok=code,id='';if(code.startsWith('GL1:')){const p=code.split(':');tok=p[1];id=p[2]||''}
  GH={tok,id};try{if(!id){const gs=await ghApi('/gists?per_page=100');const f=gs.find(g=>g.description==='Giro Livre · dados');
      if(f)id=f.id;else{const g=await ghApi('/gists',{method:'POST',body:JSON.stringify({description:'Giro Livre · dados',public:false,files:{'giro-livre.json':{content:JSON.stringify(S)}}})});id=g.id}}
    GH.id=id;try{localStorage.setItem(GHK,JSON.stringify(GH))}catch(e){}await ghPull();await ghPush();return!ghErr}catch(e){ghErr=String(e.message);GH=null;try{localStorage.removeItem(GHK)}catch(x){}return false}}
function syncTxt(){if(synced)return['on','Salvo na sua conta'];if(GH&&ghErr)return['err','Sincronização falhou'];if(GH&&ghAt){const d=new Date(ghAt);return['on','Sincronizado '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')]}if(GH)return['','Sincronizando…'];return['','Salvo neste aparelho']}
function setSync(){const el=document.getElementById('sync');if(el){const[c,t]=syncTxt();el.className='sync'+(c?' '+c:'');el.innerHTML=`<i></i>${t}`}}


/* ===================== Datas ===================== */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>iso(new Date());
const dow=d=>(d.getDay()+6)%7;
function monday(d=new Date()){const m=new Date(d);m.setHours(12,0,0,0);m.setDate(m.getDate()-dow(m));return m}
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DN=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const DNL=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const ddmm=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
function fromIso(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}

/* ===================== Semana ===================== */
const FOCOS={equilibrado:{nome:'Equilibrado',p:['vo2','base','limiar','recbase','hiit','longo','ativa'],k:1},
  queima:{nome:'Queima',p:['hiit','base','vo2','recbase','hiit','longo','ativa'],k:1},
  resistencia:{nome:'Resistência',p:['base','limiar','base','recbase','vo2','longo','ativa'],k:1.1},
  performance:{nome:'Performance',p:['vo2','base','limiar','recbase','vo2','longo','ativa'],k:1},
  leve:{nome:'Semana leve',p:['base','recbase','tempo','ativa','base','longo','ativa'],k:.75}};
const SLOTS={vo2:['vo2','v3015','billat','piramide','tiros3'],base:['base','basecad','estrada','pircad','drills'],
  limiar:['sweet','overunder','limiar','tempo','subida','escada','forca'],tempo:['tempo','escada','pircad'],
  recbase:['basecad','drills','fatmax','regen','pircad'],hiit:['v4020','tabata','sprints','express','montanha','hiitcarga'],
  longo:['estrada','fatmax','montanha','polar'],ativa:['ativa','regen','flush'],perna:['flush','regen','fatmax','drills']};
const SLOTN={vo2:'VO₂',base:'Base',limiar:'Limiar',tempo:'Tempo',recbase:'Base leve',hiit:'HIIT',longo:'Longo',ativa:'Recuperação',perna:'Pós-perna'};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function pickDay(slot,perna,used,prevId){const s=perna?'perna':slot;let pool=SLOTS[s].filter(x=>!used.has(x)&&x!==prevId);if(!pool.length)pool=SLOTS[s].filter(x=>x!==prevId);if(!pool.length)pool=SLOTS[s];
  const id=rnd(pool);const f=FOCOS[S.settings.foco]||FOCOS.equilibrado;let m=S.settings.defMin*f.k;
  if(slot==='longo')m*=1.4;if(slot==='ativa'||perna)m=Math.min(m,30);const t=TB[id];return{src:'t',id,min:clamp(r5(m),t.min,t.max),slot,perna:!!perna}}
function genWeek(keepPerna){const f=FOCOS[S.settings.foco]||FOCOS.equilibrado;const used=new Set();const old=S.plan&&S.plan.days||[];
  const days=f.p.map((slot,i)=>{const d=pickDay(slot,keepPerna&&old[i]&&old[i].perna,used);used.add(d.id);return d});
  S.plan={week:iso(monday()),days}}
function ensureWeek(){if(!S.plan||S.plan.week!==iso(monday())){genWeek(true);save();return true}return false}

/* ===================== Treinos ===================== */
const rMax=bl=>bl.reduce((a,x)=>x.z>=4?Math.max(a,...(String(x.r).match(/\d/g)||[0]).map(Number)):a,0);
function progBl(id,bl){const g=S.prog&&S.prog[id];if(!g)return bl;const base=rMax(bl);if(!base||g===base)return bl;const d=g-base;
  return bl.map(x=>x.z>=4?{...x,r:x.r.replace(/R(\d)/g,(m,n)=>'R'+clamp(+n+d,1,8))}:x)}
function pageToast(t){const el=document.createElement('div');el.className='toast';el.innerHTML=`<div class="tt"><b>${esc(t)}</b></div>`;document.body.appendChild(el);setTimeout(()=>el.remove(),6500)}
function getW(ref){if(!ref)return null;if(ref.src==='c'){const c=S.custom.find(x=>x.id===ref.id);if(!c)return null;
    return{nome:c.nome,cat:c.cat,i:c.i,foco:c.foco||'Treino criado por você',blocks:c.blocks,custom:1,perna:c.perna}}
  const t=TB[ref.id];if(!t)return null;const T=clamp(ref.min||S.settings.defMin,t.min,t.max);
  return{nome:t.nome,cat:t.cat,i:t.i,foco:t.foco,blocks:progBl(t.id,buildT(t,T)),min:T,t,prog:S.prog&&S.prog[t.id]}}
const kcal=bl=>Math.round(bl.reduce((a,x)=>a+(x.p===POS.FB?2.5:MET[x.z])*S.settings.peso*x.d/3600,0));
const z45=bl=>Math.round(bl.reduce((a,x)=>a+(x.z>=4?x.d:0),0)/60);
const mins=bl=>Math.round(sum(bl)/60);
function condOk(w,cond){if(cond==='cansado')return w.i<=2;if(cond==='perna')return !!w.perna;if(cond==='normal')return w.cat!=='Teste';return true}

/* ===================== UI helpers ===================== */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
function prof(bl,cls=''){const tot=sum(bl)||1,W=1000,H=44;let x=0,r='';for(const k of bl){const w=k.d/tot*W;const hh=(k.p===POS.FB?.6:k.z)/5*(H-6)+6;
  r+=`<rect x="${x.toFixed(1)}" y="${(H-hh).toFixed(1)}" width="${Math.max(w-1.2,.8).toFixed(1)}" height="${hh.toFixed(1)}" fill="var(--z${k.z})"/>`;x+=w}
  return`<svg class="prof ${cls}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${r}</svg>`}
const ipill=i=>`<span class="pill"><span class="dot" style="background:var(--z${INTZ[i]})"></span>${INT[i]}</span>`;
const zp=z=>`<span class="zp" style="background:var(--z${z})">Z${z}</span>`;
function metaLine(w){return`<div class="meta num"><span><b>${mins(w.blocks)}</b> min</span><span><b>${kcal(w.blocks)}</b> kcal</span><span><b>${z45(w.blocks)}</b> min Z4–Z5</span><span>${esc(w.cat)}</span>${w.prog?`<span>tiros <b>R${w.prog}</b></span>`:''}</div>`}
const refKey=r=>JSON.stringify({src:r.src,id:r.id,min:r.min||0});
const chips=(name,opts,cur)=>`<div class="chips" role="group">${opts.map(([v,l])=>`<button class="chip" data-a="${name}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;
const CONDS=[['pronto','Descansado'],['normal','Normal'],['cansado','Cansado'],['perna','Pós-perna']];

const ICON={hoje:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',semana:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  bib:'<path d="M5 4h4v16H5zM11 4h4v16h-4zM17 6l3 .8-3.6 13.5-3-.8"/>',meus:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',hist:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'};
const TABS=[['hoje','Hoje'],['semana','Semana'],['bib','Biblioteca'],['meus','Meus'],['hist','Histórico']];
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" data-a="tab" data-v="${k}" aria-selected="${ui.tab===k}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}</button>`).join('')}

function header(title,sub){return`<div class="top"><div><div class="eyebrow">${sub}</div><h1>${title}</h1></div>${(([c,t])=>`<div id="sync" class="sync${c?' '+c:''}"><i></i>${t}</div>`)(syncTxt())}</div>`}

  app.innerHTML=({hoje:vHoje,semana:vSemana,bib:vBib,meus:vMeus,hist:vHist}[ui.tab])()}

/* ---------- Hoje ---------- */
function vHoje(){const d=new Date(),di=dow(d),day=S.plan.days[di],w=getW(day),done=doneOn(today());
  let h=header('Hoje',`${DNL[di]}, ${ddmm(d)} · foco ${esc(((FOCOS[S.settings.foco]||{}).nome||'').toLowerCase())}`);
  h+=`<section><div class="card hero">`;
  if(w){h+=`<div class="lc-head"><div><div class="eyebrow">${done.length?'Feito hoje':'Programado'} · ${SLOTN[day.slot]||'Livre'}${day.perna?' · pós-perna':''}</div><h2 style="margin-top:4px">${esc(w.nome)}</h2><div class="foco">${esc(w.foco)}</div></div>${ipill(w.i)}</div>${prof(w.blocks,'lg')}${metaLine(w)}
    <div class="row"><button class="btn go wide" data-a="start-day" data-v="${di}">Iniciar treino</button><button class="btn" data-a="open-day" data-v="${di}">Ajustar</button></div>`}
  else h+=`<div class="empty">O treino de hoje foi removido. Abra a Semana e escolha outro.</div>`;
  if(done.length)h+=`<div class="meta">${done.map(x=>`<span>✓ <b>${esc(x.nome)}</b> · ${x.min} min · RPE ${x.rpe||'–'}</span>`).join('')}</div>`;
  h+=`</div></section>`;
  h+=`<section><h2>Outra opção agora</h2><div class="card"><div class="field"><label>Como está o corpo</label>${chips('cond',CONDS,ui.cond)}</div>
    <div class="field"><label for="hoje-t">Tempo disponível</label><div class="slider"><input id="hoje-t" type="range" min="20" max="120" step="5" value="${ui.T}" data-in="T"><output class="num" id="hoje-t-o">${ui.T} min</output></div></div></div>
    <div class="list" id="sug">${sugList()}</div></section>`;
  return h}
function suggestions(){const T=ui.T,c=ui.cond;const recent=new Set(S.hist.filter(x=>(Date.now()-fromIso(x.date))/864e5<=2).map(x=>x.cat));
  let o=TPL.filter(t=>condOk(t,c)&&t.min<=T&&t.max>=T).map(t=>({src:'t',id:t.id,min:T,cat:t.cat}));
  o=o.concat(S.custom.filter(x=>condOk(x,c)&&Math.abs(mins(x.blocks)-T)<=10).map(x=>({src:'c',id:x.id,cat:x.cat})));
  const seed=ui.shuf*7919+T;o.forEach((x,k)=>x.s=((Math.sin(seed+k*12.9898+x.id.length*78.233)*43758.5453)%1+1)%1-(recent.has(x.cat)?.6:0));
  return o.sort((a,b2)=>b2.s-a.s).slice(0,5)}
function sugList(){const s=suggestions();if(!s.length)return`<div class="empty">Nenhum modelo cabe em ${ui.T} min nessa condição. Mude o tempo ou a condição.</div>`;
  return s.map(cardW).join('')+`<button class="btn ghost" data-a="shuffle">Embaralhar sugestões</button>`}
function cardW(ref){const w=getW(ref);if(!w)return'';const clampNote=w.t&&ref.min&&(ref.min<w.t.min||ref.min>w.t.max)?`<span class="pill">faixa ${w.t.min}–${w.t.max} min</span>`:'';
  return`<div class="card tap" data-a="detail" data-v='${esc(refKey(ref))}' tabindex="0"><div class="lc-head"><div><h3>${esc(w.nome)}</h3><div class="foco">${esc(w.foco)}</div></div>${ipill(w.i)}</div>${prof(w.blocks)}<div class="row between">${metaLine(w)}${clampNote}</div></div>`}

/* ---------- Semana ---------- */
function vSemana(){const mon=monday(),ti=dow(new Date());const p=S.plan;let tot=0,tk=0,tz=0;
  const rows=p.days.map((d,i)=>{const w=getW(d);const date=iso(addD(mon,i));const dn=doneOn(date);if(w){tot+=mins(w.blocks);tk+=kcal(w.blocks);tz+=z45(w.blocks)}
    return`<button class="day${i===ti?' today':''}" data-a="open-day" data-v="${i}"><div><div class="dn">${DN[i]}</div><div class="dd num">${ddmm(addD(mon,i))}</div></div>
    <div class="body">${d.perna?'<span class="tag">Dia de perna</span>':''}<span class="nm">${w?esc(w.nome):'Sem treino'}</span>${w?prof(w.blocks):''}</div>
    <div class="stack" style="gap:6px;align-items:flex-end"><span class="num" style="font-weight:700">${w?mins(w.blocks)+' min':''}</span>${dn.length?'<span class="state ok">Feito</span>':(i<ti?'<span class="state">Pulado</span>':(w?ipill(w.i):''))}</div></button>`}).join('');
  let h=header('Semana',`${ddmm(mon)} a ${ddmm(addD(mon,6))}`);
  h+=`<section><div class="tiles"><div class="tile"><b class="num">${tot}</b><span>min planejados</span></div><div class="tile"><b class="num">${tk}</b><span>kcal estimadas</span></div><div class="tile"><b class="num">${tz}</b><span>min Z4–Z5</span></div><div class="tile"><b class="num">${p.days.filter((d,i)=>doneOn(iso(addD(mon,i))).length).length}/7</b><span>dias feitos</span></div></div></section>`;
  h+=`<section><div class="week">${rows}</div><div class="muted" style="font-size:13px">Toque num dia para trocar o treino, mudar o tempo ou marcar dia de perna.</div></section>`;
  h+=calSec();
  h+=`<section><h2>Montar a semana</h2><div class="card"><div class="field"><label>Foco</label>${chips('foco',Object.entries(FOCOS).map(([k,v])=>[k,v.nome]),S.settings.foco)}</div>
    <div class="field"><label for="def-t">Tempo padrão por dia</label><div class="slider"><input id="def-t" type="range" min="20" max="90" step="5" value="${S.settings.defMin}" data-in="def"><output class="num" id="def-t-o">${S.settings.defMin} min</output></div></div>
    <div class="row"><button class="btn pri wide" data-a="gen-week">Gerar nova semana</button></div>
    <div class="muted" style="font-size:13px">Dias de perna marcados ficam com treino leve de recuperação. O dia longo usa 1,4× o tempo padrão.</div></div></section>`;
  h+=`<section><h2>Ajustes</h2><div class="card"><div class="grid2"><div class="field"><label for="peso">Peso (kg) para kcal</label><input id="peso" type="number" min="40" max="200" value="${S.settings.peso}" data-in="peso"></div></div>
    <div class="field"><label>Backup dos dados</label><div class="row"><button class="btn sm" data-a="bk-copy">Copiar backup</button><button class="btn sm" data-a="bk-restore">Restaurar backup</button></div><div class="muted" id="bk-msg" style="font-size:13px">Copia histórico, treinos seus e semana. Cole no Notes para guardar ou para levar a outro aparelho.</div></div>${ghOK()?`<div class="field"><label>Sincronizar celular e PC</label>${GH?`<div class="row"><span class="pill"><span class="dot" style="background:var(--z2)"></span>Ligado</span><button class="btn sm" data-a="gh-code">Copiar código para o outro aparelho</button><button class="btn sm" data-a="gh-sync">Sincronizar agora</button><button class="btn sm danger" data-a="gh-off">Desligar</button></div>`:`<div class="row" style="flex-wrap:nowrap"><input id="gh-tok" type="text" placeholder="Cole o token ou o código GL1:…" autocomplete="off"><button class="btn sm pri" data-a="gh-on">Conectar</button></div><div class="muted" style="font-size:13px">No PC, crie um token em <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Giro%20Livre" target="_blank" rel="noopener">github.com/settings/tokens</a> marcando só <b>gist</b> e validade <b>No expiration</b>, e cole aqui. No celular, cole o código copiado do PC.</div>`}<div class="muted" id="gh-msg" style="font-size:13px"></div></div>`:''}</div></section>`;
  return h}
function dayRef(i){return S.plan.days[i]}
function sheetDay(i){const d=dayRef(i),w=getW(d),t=d.src==='t'?TB[d.id]:null;const mon=monday();
  let h=`<div class="sheet-h"><div><div class="eyebrow">${DNL[i]} ${ddmm(addD(mon,i))} · ${SLOTN[d.slot]||'Livre'}</div><h2 style="margin-top:4px">${w?esc(w.nome):'Sem treino'}</h2>${w?`<div class="foco">${esc(w.foco)}</div>`:''}</div><button class="x" data-a="close" aria-label="Fechar">×</button></div>`;

  h+=`<div class="row"><button class="btn go wide" data-a="start-day" data-v="${i}">Iniciar</button><button class="btn" data-a="day-roll" data-v="${i}">Sortear outro</button></div>

  if(w)h+=blocksTable(w.blocks);
  openSheet(h)}
function sheetChoose(i){let f=ui.chooseI||0;const all=[...S.custom.map(c=>({src:'c',id:c.id})),...TPL.map(t=>({src:'t',id:t.id,min:dayRef(i).min||S.settings.defMin}))];

function weekChart(ws){const W=640,H=170,pl=34,pb=24,pt=12;const mx=Math.max(60,...ws.map(w=>w.v));const top=Math.ceil(mx/60)*60;const bw=(W-pl)/ws.length;
  let g='';for(let k=0;k<=3;k++){const v=top*k/3,y=H-pb-(H-pb-pt)*k/3;g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`}
  ws.forEach((w,k)=>{const hh=(H-pb-pt)*w.v/top,x=pl+k*bw+bw*.2,last=k===ws.length-1;g+=`<rect x="${x}" y="${H-pb-hh}" width="${bw*.6}" height="${Math.max(hh,0)}" rx="3" fill="${last?'var(--accent)':'var(--z1)'}" opacity="${last?1:.75}"/>`+
    (w.v?`<text x="${x+bw*.3}" y="${H-pb-hh-4}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${w.v}</text>`:'')+`<text x="${x+bw*.3}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${ddmm(w.m)}</text>`});
  return`<div class="tbl"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto;display:block" role="img" aria-label="Minutos de bike por semana">${g}</svg></div>`}

  case'bk-up':case'bk-down':{const i=+v,j=i+(a==='bk-up'?-1:1);if(j<0||j>=E.blocks.length)break;[E.blocks[i],E.blocks[j]]=[E.blocks[j],E.blocks[i]];renderEditor();break}
  case'bk-dup':E.blocks.splice(+v+1,0,{...E.blocks[+v]});renderEditor();break;
  case'bk-del':E.blocks.splice(+v,1);renderEditor();break;
  case'bk-add':E.blocks.push(b(5*M,2,'90','R4','SP','Ritmo constante'));renderEditor();break;
  case'bk-warm':E.blocks.unshift(...warm());renderEditor();break;
  case'bk-cool':E.blocks.push(...cool());renderEditor();break;
  case'iv-add':{const g=id=>document.getElementById(id).value;const n=clamp(+g('iv-n')||1,1,40),on=parseT(g('iv-on')),off=parseT(g('iv-off')),z=+g('iv-z');
    if(on<5){document.getElementById('ed-msg').textContent='Esforço precisa de pelo menos 5 segundos.';break}
    for(let k=1;k<=n;k++){E.blocks.push(b(on,z,g('iv-rpm'),g('iv-r'),'SP',`Tiro ${k}/${n}`));if(off>=5)E.blocks.push(b(off,1,'85','R2','SP','Recupera'))}renderEditor();break}
  case'ed-save':{const m=document.getElementById('ed-msg');if(!E.nome||!E.nome.trim()){m.textContent='Dê um nome ao treino para salvar.';document.getElementById('ed-nome').focus();break}
    if(!E.blocks.length){m.textContent='Adicione ao menos um bloco.';break}
    const o={id:E.id||'c'+Date.now().toString(36),nome:E.nome.trim(),cat:E.cat,i:+E.i,perna:!!E.perna,foco:E.foco||'Treino criado por você',blocks:E.blocks.filter(x=>x.d>0),u:Date.now()};
    const ix=S.custom.findIndex(c=>c.id===o.id);if(ix>=0)S.custom[ix]=o;else S.custom.unshift(o);save();closeSheet();ui.tab='meus';render();break}
  case'ed-del':if(!E.del){E.del=1;renderEditor();break}S.del=[...(S.del||[]),E.id];S.custom=S.custom.filter(c=>c.id!==E.id);S.plan.days.forEach((d,i)=>{if(d.src==='c'&&d.id===E.id)S.plan.days[i]=pickDay(d.slot||'base',d.perna,new Set())});save();closeSheet();render();break;
  case'pl-play':plToggle();break;
  case'pl-prev':plJump(-1);break;
  case'pl-next':plJump(1);break;
  case'cal-mv':{const m=ui.calM;ui.calM=new Date(m.getFullYear(),m.getMonth()+(+v),1,12);render();break}
  case'cal-day':ui.calSel=v;document.querySelectorAll('.cal-d.sel').forEach(e=>e.classList.remove('sel'));t.classList.add('sel');document.getElementById('cal-det').innerHTML=calDet();break;
  case'qa':adjDo(v);break;
  case'ask':{const a=document.getElementById('pl-ask');a.hidden=!a.hidden;if(!a.hidden)document.getElementById('adj-txt').focus();break}
  case'adj-go':adjDo(document.getElementById('adj-txt').value);break;
  case'undo':adjUndo();break;
  case'gh-on':{const m=document.getElementById('gh-msg'),tk=document.getElementById('gh-tok').value;if(!tk.trim()){m.textContent='Cole o token primeiro.';break}m.textContent='Conectando…';
    ghConnect(tk).then(ok=>{if(ok)render();else{const mm=document.getElementById('gh-msg');if(mm)mm.textContent='Não consegui conectar ('+ghErr+'). Confira se o token tem a permissão gist.'}});break}
  case'gh-code':{const c='GL1:'+GH.tok+':'+GH.id,m=document.getElementById('gh-msg'),sh=()=>{m.textContent=c};
    try{navigator.clipboard.writeText(c).then(()=>{m.textContent='Código copiado. No outro aparelho, cole em Semana › Ajustes › Sincronizar. Ele dá acesso aos seus dados de treino: não compartilhe.'},sh)}catch(e){sh()}break}
  case'gh-sync':{const m=document.getElementById('gh-msg');m.textContent='Sincronizando…';ghPull().then(()=>ghPush()).then(()=>{render()});break}
  case'gh-off':GH=null;try{localStorage.removeItem(GHK)}catch(e){}render();break;
  case'rused':{t.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===t));P.rUsed=+v;document.getElementById('r-tip').textContent=+v===P.rPlan?'Igual ao planejado.':`Planejado R${P.rPlan}, você fez R${v}.`;break}
  case'pl-voz':voz=!voz;try{localStorage.setItem('gl_voz',voz?'1':'0')}catch(e){}t.textContent=voz?'Voz: on':'Voz: off';if(!voz)try{speechSynthesis.cancel()}catch(e){}break;
  case'pl-end':if(P.el>60)finishPlayer(false);else closePlayer();break;
  case'rpe':{t.parentElement.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===t));if(P)P.rpe=+v;ui.histMan={rpe:+v};{const tp=document.getElementById('rpe-tip');if(tp)tp.textContent=`RPE ${v}: ${RPED[v]}`}break}
  case'fin-save':{const n=document.getElementById('fin-nota').value.trim();S.hist.push({id:'h'+Date.now().toString(36),ts:Date.now(),date:today(),nome:P.w.nome,cat:P.w.cat,min:P.res.min,kcal:P.res.kcal,z45:P.res.z45,rpe:P.rpe||null,nota:n,cond:P.cond,tid:P.ref&&P.ref.src==='t'?P.ref.id:null,rPlan:P.rPlan||null,rUsed:P.rUsed||null});let pm='';
    if(P.ref&&P.ref.src==='t'&&P.rUsed&&P.rpe&&P.el>=sum(P.bl)*.8){const nt=clamp(P.rpe<=7?P.rUsed+1:P.rpe>=10?P.rUsed-1:P.rUsed,1,8);S.prog=Object.assign({},S.prog,{[P.ref.id]:nt});pm=`Próximo ${P.w.nome}: tiros em R${nt}${nt>P.rUsed?' (sobe 1 nível)':nt<P.rUsed?' (desce 1 nível)':' (mantém)'}`}
    if(S.hist.length>500)S.hist=S.hist.slice(-500);save();closePlayer();render();if(pm)pageToast(pm);break}
  case'fin-discard':if(!ui.disc){ui.disc=1;t.textContent='Toque de novo';break}closePlayer();render();break;
  case'man':ui.histMan={rpe:6};sheetManual();break;
  case'bk-copy':{const txt=JSON.stringify(S);const m=document.getElementById('bk-msg');
    const fb=()=>{openSheet(`<div class="sheet-h"><h2>Backup</h2><button class="x" data-a="close" aria-label="Fechar">×</button></div><div class="muted">Selecione tudo e copie.</div><textarea id="bk-out" style="min-height:200px" readonly>${esc(txt)}</textarea>`);const ta=document.getElementById('bk-out');ta.focus();ta.select()};
    try{navigator.clipboard.writeText(txt).then(()=>{m.textContent=`Backup copiado: ${S.hist.length} sessões e ${S.custom.length} treinos seus.`},fb)}catch(e){fb()}break}
  case'bk-restore':openSheet(`<div class="sheet-h"><h2>Restaurar backup</h2><button class="x" data-a="close" aria-label="Fechar">×</button></div><div class="muted">Cole o texto do backup. Isso substitui os dados atuais deste aparelho.</div><textarea id="bk-in" style="min-height:200px"></textarea><button class="btn pri" data-a="bk-apply">Restaurar</button><div id="bk-err" class="muted"></div>`);break;
  case'bk-apply':{try{const o=JSON.parse(document.getElementById('bk-in').value);if(!o||!Array.isArray(o.hist)||!Array.isArray(o.custom))throw 0;S=Object.assign(defState(),o);ensureWeek();save();closeSheet();render()}catch(e){document.getElementById('bk-err').textContent='Texto inválido. Copie o backup inteiro, do primeiro { ao último }.'}break}
  case'man-save':{const g=id=>document.getElementById(id).value;const mn=clamp(+g('mn-min')||0,1,300),rp=ui.histMan.rpe||6;const met=rp<=3?4.5:rp<=5?7:rp<=7?8.5:rp<=8?10.5:13;
    S.hist.push({id:'h'+Date.now().toString(36),ts:fromIso(g('mn-date')||today()).getTime(),date:g('mn-date')||today(),nome:g('mn-nome')||'Pedal livre',cat:'Livre',min:mn,kcal:Math.round(met*S.settings.peso*mn/60),z45:0,rpe:rp,nota:g('mn-nota').trim()});save();closeSheet();render();break}
  case'h-del':if(ui.hdel!==v){ui.hdel=v;render();break}S.del=[...(S.del||[]),v];S.hist=S.hist.filter(x=>x.id!==v);ui.hdel=null;save();render();break;
  }});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='adj-txt'){e.preventDefault();adjDo(e.target.value);return}
  if(P&&!P.fin&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.code==='Space'){e.preventDefault();plToggle();return}if(e.key==='ArrowRight'){e.preventDefault();plJump(1);return}if(e.key==='ArrowLeft'){e.preventDefault();plJump(-1);return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();adjUndo();return}if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[1-9]$/.test(e.key)&&QA[+e.key-1]){adjDo(QA[+e.key-1][1]);return}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card.tap')){e.preventDefault();e.target.click()}if(e.key==='Escape'&&!P)closeSheet()});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.in==='T'){ui.T=+t.value;document.getElementById('hoje-t-o').textContent=ui.T+' min';document.getElementById('sug').innerHTML=sugList()}
  else if(t.dataset.in==='libT'){ui.libT=+t.value;document.getElementById('lib-t-o').textContent=ui.libT+' min';document.getElementById('liblist').innerHTML=libList()}
  else if(t.dataset.in==='def'){S.settings.defMin=+t.value;document.getElementById('def-t-o').textContent=t.value+' min'}
  else if(t.dataset.ed&&E){const k=t.dataset.ed;E[k]=t.type==='checkbox'?t.checked:t.value;if(k==='i')E.i=+t.value}
  else if(t.dataset.bk&&E){const[i,k]=t.dataset.bk.split(':');const x=E.blocks[+i];if(!x)return;
    if(k==='d'){x.d=parseT(t.value)}else if(k==='z'){x.z=+t.value;t.closest('.blk').style.borderLeftColor=`var(--z${x.z})`}else x[k]=t.value;edRefresh()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.in==='def'){save()}
  else if(t.dataset.in==='peso'){S.settings.peso=clamp(+t.value||102,40,200);save()}
  else if(t.dataset.in==='libCat'){ui.libCat=t.value;document.getElementById('liblist').innerHTML=libList()}
  else if(t.dataset.bk==null&&t.dataset.ed==null)return;
  if(t.dataset.bk&&t.dataset.bk.endsWith(':d')&&E){const x=E.blocks[+t.dataset.bk.split(':')[0]];if(x)t.value=fmt(x.d)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P&&P.run)lock(true)});

ui.T=S.settings.defMin;ui.libT=S.settings.defMin;
render();initDb();ghPull();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!P)ghPull()});
</script>
